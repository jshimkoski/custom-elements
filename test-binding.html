<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binding Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .active {
      border: 2px solid green;
    }
    .test-section {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
    }
    .test-section h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <h1>Binding Test</h1>

  <div class="test-section">
    <h3>Test Component with Bindings</h3>
    <binding-test></binding-test>
  </div>

  <script type="module">
    import { component, html } from './src/lib/runtime.js';
    import { vIf, vBind, vClass, vStyle, vModel } from './src/lib/directives.js';

    // Define a test component with various binding scenarios
    component('binding-test', {
      state: {
        name: 'Test User',
        isActive: false,
        isDisabled: true,
        buttonText: 'Click Me',
        inputValue: 'Hello World',
        color: 'blue',
        fontSize: 16,
      },

      computed: {
        dynamicClass() {
          return {
            active: this.isActive,
            disabled: this.isDisabled
          };
        },

        dynamicStyle() {
          return {
            color: this.color,
            fontSize: `${this.fontSize}px`,
            fontWeight: this.isActive ? 'bold' : 'normal'
          };
        }
      },

      methods: {
        toggleActive() {
          this.isActive = !this.isActive;
        },

        toggleDisabled() {
          this.isDisabled = !this.isDisabled;
        },

        changeColor() {
          this.color = this.color === 'blue' ? 'red' : 'blue';
        },

        increaseFontSize() {
          this.fontSize = Math.min(this.fontSize + 2, 24);
        },

        decreaseFontSize() {
          this.fontSize = Math.max(this.fontSize - 2, 12);
        }
      },

      render(state) {
        return html`
          <div>
            <h4>Current State:</h4>
            <p>Name: ${state.name}</p>
            <p>Is Active: ${state.isActive}</p>
            <p>Is Disabled: ${state.isDisabled}</p>
            <p>Color: ${state.color}</p>
            <p>Font Size: ${state.fontSize}px</p>

            <div class="test-section">
              <h4>1. Colon Binding (:disabled)</h4>
              <button :disabled="${state.isDisabled}" @click="${this.toggleDisabled}">
                ${state.isDisabled ? 'Button is Disabled' : 'Button is Enabled'}
              </button>
              <p>Toggle button state: <button @click="${this.toggleDisabled}">Toggle Disabled</button></p>
            </div>

            <div class="test-section">
              <h4>2. v-bind Object Syntax</h4>
              <button v-bind="${{ disabled: state.isDisabled, title: 'This is a tooltip' }}">
                v-bind Object Button
              </button>
            </div>

            <div class="test-section">
              <h4>3. v-class Directive</h4>
              <div v-class="${['test-class', { active: state.isActive, disabled: state.isDisabled }]}">
                This div has conditional classes
              </div>
              <button @click="${this.toggleActive}">Toggle Active Class</button>
            </div>

            <div class="test-section">
              <h4>4. v-style Directive</h4>
              <p v-style="${{ color: state.color, fontSize: state.fontSize + 'px', fontWeight: state.isActive ? 'bold' : 'normal' }}">
                This text has dynamic styles
              </p>
              <button @click="${this.changeColor}">Change Color</button>
              <button @click="${this.increaseFontSize}">Increase Font</button>
              <button @click="${this.decreaseFontSize}">Decrease Font</button>
            </div>

            <div class="test-section">
              <h4>5. v-model Directive</h4>
              <div class="form-group">
                <label>Text Input:</label>
                <input type="text" v-model="inputValue" />
                <p>Current value: ${state.inputValue}</p>
              </div>

              <div class="form-group">
                <label>Checkbox:</label>
                <input type="checkbox" v-model="isActive" />
                <span>Active: ${state.isActive}</span>
              </div>
            </div>

            <div class="test-section">
              <h4>6. Combined Bindings</h4>
              <input
                type="text"
                v-model="name"
                :disabled="${state.isDisabled}"
                v-class="${{ active: state.isActive }}"
                v-style="${{ borderColor: state.color }}"
                placeholder="Enter your name"
              />
              <p>Combined input with multiple bindings</p>
            </div>

            <div class="test-section">
              <h4>7. Conditional Rendering with v-if</h4>
              ${vIf(state.isActive, html`
                <div style="background: lightgreen; padding: 10px; border-radius: 4px;">
                  <p>This content is only visible when active!</p>
                  <button :disabled="${state.isDisabled}" @click="${this.toggleActive}">
                    Hide This Content
                  </button>
                </div>
              `)}

              ${vIf(!state.isActive, html`
                <div style="background: lightcoral; padding: 10px; border-radius: 4px;">
                  <p>This content is only visible when not active!</p>
                  <button :disabled="${state.isDisabled}" @click="${this.toggleActive}">
                    Show Other Content
                  </button>
                </div>
              `)}
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
