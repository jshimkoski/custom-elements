<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Style Debug</title>
</head>
<body>
    <h1>Simple Style Debug Test</h1>

    <div>
        <h2>Test 1: Basic String Style</h2>
        <test-basic id="test1"></test-basic>
    </div>

    <div>
        <h2>Test 2: Function Style</h2>
        <test-function id="test2"></test-function>
    </div>

    <script>
        // Inline minimal version of component system to isolate the issue
        function createSimpleComponent(name, config) {
            class SimpleComponent extends HTMLElement {
                constructor() {
                    super();
                    this.attachShadow({ mode: 'open' });
                    this._state = { ...config.state };
                    this._config = config;

                    console.log(`[${name}] Creating component with style:`, config.style);

                    this._render();
                }

                _render() {
                    console.log(`[${this.tagName}] Starting render`);

                    // Apply styles
                    this._applyStyle();

                    // Render content
                    const content = this._config.render(this._state);
                    const div = document.createElement('div');
                    div.innerHTML = content;
                    this.shadowRoot.appendChild(div);

                    console.log(`[${this.tagName}] Shadow DOM HTML:`, this.shadowRoot.innerHTML);
                }

                _applyStyle() {
                    console.log(`[${this.tagName}] Applying styles...`);

                    let styleElement = this.shadowRoot.querySelector('style');
                    if (!styleElement) {
                        styleElement = document.createElement('style');
                        this.shadowRoot.prepend(styleElement);
                        console.log(`[${this.tagName}] Created new style element`);
                    }

                    if (!this._config.style) {
                        console.log(`[${this.tagName}] No style config`);
                        styleElement.textContent = '';
                        return;
                    }

                    let css;
                    if (typeof this._config.style === 'string') {
                        css = this._config.style;
                        console.log(`[${this.tagName}] Using string style:`, css);
                    } else if (typeof this._config.style === 'function') {
                        css = this._config.style(this._state);
                        console.log(`[${this.tagName}] Generated function style:`, css);
                    } else if (typeof this._config.style === 'object' && this._config.style.css) {
                        if (typeof this._config.style.css === 'function') {
                            css = this._config.style.css(this._state);
                        } else {
                            css = this._config.style.css;
                        }
                        console.log(`[${this.tagName}] Using object style:`, css);
                    }

                    if (css) {
                        styleElement.textContent = css;
                        console.log(`[${this.tagName}] Applied CSS to style element:`, styleElement.textContent);
                    } else {
                        console.warn(`[${this.tagName}] No CSS generated!`);
                    }
                }

                updateState(updates) {
                    Object.assign(this._state, updates);
                    this._render();
                }
            }

            customElements.define(name, SimpleComponent);
            return SimpleComponent;
        }

        // Test 1: Basic string style
        createSimpleComponent('test-basic', {
            state: { message: 'Hello World' },

            style: `
                :host {
                    display: block;
                    padding: 20px;
                    background: lightblue;
                    border: 2px solid blue;
                    margin: 10px 0;
                    border-radius: 8px;
                }
                .content {
                    color: darkblue;
                    font-weight: bold;
                    font-size: 18px;
                }
            `,

            render: (state) => `<div class="content">${state.message}</div>`
        });

        // Test 2: Function style
        createSimpleComponent('test-function', {
            state: { color: 'red', message: 'Function Style' },

            style: (state) => `
                :host {
                    display: block;
                    padding: 20px;
                    background: light${state.color === 'red' ? 'coral' : 'green'};
                    border: 2px solid ${state.color};
                    margin: 10px 0;
                    border-radius: 8px;
                }
                .content {
                    color: ${state.color};
                    font-weight: bold;
                    font-size: 18px;
                }
                .button {
                    margin-top: 10px;
                    padding: 8px 16px;
                    background: ${state.color};
                    color: white;
                    border: none;
                    border-radius: 4px;
                    cursor: pointer;
                }
            `,

            render: (state) => `
                <div class="content">${state.message} - Color: ${state.color}</div>
                <button class="button" onclick="changeColor()">Change Color</button>
            `
        });

        // Global function for button
        window.changeColor = () => {
            const element = document.querySelector('test-function');
            const colors = ['red', 'blue', 'green', 'purple'];
            const currentColor = element._state.color;
            const currentIndex = colors.indexOf(currentColor);
            const newColor = colors[(currentIndex + 1) % colors.length];

            console.log(`Changing color from ${currentColor} to ${newColor}`);
            element.updateState({ color: newColor });
        };

        // Debug info after load
        window.addEventListener('load', () => {
            console.log('=== PAGE LOADED - DEBUGGING INFO ===');

            document.querySelectorAll('test-basic, test-function').forEach((el, index) => {
                console.log(`\nElement ${index + 1}: ${el.tagName}`);
                console.log('Shadow Root exists:', !!el.shadowRoot);

                if (el.shadowRoot) {
                    console.log('Shadow Root HTML:', el.shadowRoot.innerHTML);

                    const style = el.shadowRoot.querySelector('style');
                    console.log('Style element exists:', !!style);

                    if (style) {
                        console.log('Style content length:', style.textContent.length);
                        console.log('Style content preview:', style.textContent.substring(0, 200) + '...');
                    }
                } else {
                    console.error('NO SHADOW ROOT FOUND!');
                }
            });
        });
    </script>
</body>
</html>
