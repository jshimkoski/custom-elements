<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anchor Block Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .test-section {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      .test-section h3 {
        margin-top: 0;
      }
      button {
        margin: 5px;
        padding: 8px 16px;
        cursor: pointer;
      }
      input {
        margin: 5px;
        padding: 4px 8px;
      }
      .highlight {
        background: yellow;
      }
    </style>
  </head>
  <body>
    <h1>Anchor Block Test</h1>

    <div class="test-section">
      <h3>Test Component:</h3>
      <my-greeting></my-greeting>
    </div>

    <div class="test-section">
      <h3>Child Component:</h3>
      <child-component></child-component>
    </div>

    <div class="test-section">
      <h3>Debug Info:</h3>
      <button onclick="inspectDOM()">Inspect DOM</button>
      <button onclick="testRerender()">Test State Changes</button>
      <button onclick="testConditions()">Test vIf Conditions</button>
      <div
        id="debug-output"
        style="
          margin-top: 10px;
          background: #f5f5f5;
          padding: 10px;
          border-radius: 4px;
        "
      >
        <em>Click "Inspect DOM" to see the current DOM structure</em>
      </div>
    </div>

    <script type="module">
      import { component } from './src/lib/runtime-v2.ts';

      // Make components globally available
      window.testRerender = function() {
          const greeting = document.querySelector('my-greeting');
          if (greeting && greeting._api) {
              greeting._api.state.name = 'Re-rendered at ' + new Date().toLocaleTimeString();
              greeting._api.state.array = ['X', 'Y', 'Z'];
          }
      };

      window.testConditions = function() {
          const greeting = document.querySelector('my-greeting');
          if (greeting && greeting._api) {
              const currentName = greeting._api.state.name;
              // Toggle between different conditions to test vIf stability
              if (currentName === 'World') {
                  greeting._api.state.name = 'Testing';
              } else if (currentName === 'Testing') {
                  greeting._api.state.name = 'Custom Element';
              } else {
                  greeting._api.state.name = 'World';
              }
              console.log('Condition changed to:', greeting._api.state.name);
          }
      };

      window.inspectDOM = function() {
          const greeting = document.querySelector('my-greeting');
          if (greeting && greeting.shadowRoot) {
              const debugOutput = document.getElementById('debug-output');
              const shadowHTML = greeting.shadowRoot.innerHTML;

              // Count all nodes including text and comment nodes
              function analyzeNodes(node) {
                  const analysis = {
                      elements: [],
                      comments: [],
                      textNodes: [],
                      anchorBoundaries: [],
                      emptyTextNodes: []
                  };

                  const walker = document.createTreeWalker(
                      node,
                      NodeFilter.SHOW_ALL,
                      null,
                      false
                  );
                  let current;
                  while (current = walker.nextNode()) {
                      const key = (current as any).key;

                      if (current.nodeType === Node.ELEMENT_NODE) {
                          analysis.elements.push({node: current, key, tag: current.tagName});
                      } else if (current.nodeType === Node.COMMENT_NODE) {
                          analysis.comments.push({node: current, key, data: current.data});
                      } else if (current.nodeType === Node.TEXT_NODE) {
                          analysis.textNodes.push({node: current, key, content: current.textContent});
                          if (current.textContent === "" && key) {
                              analysis.anchorBoundaries.push({node: current, key});
                          }
                          if (current.textContent === "") {
                              analysis.emptyTextNodes.push({node: current, key});
                          }
                      }
                  }
                  return analysis;
              }

              const nodeAnalysis = analyzeNodes(greeting.shadowRoot);
              const visibleComments = nodeAnalysis.comments.filter(c => c.data && c.data.trim().length > 0);
              const visibleTextInHTML = shadowHTML.includes('<!--') ? 'YES' : 'NO';

              debugOutput.innerHTML = `
                  <h4>Shadow DOM HTML:</h4>
                  <pre style="background: white; padding: 10px; border: 1px solid #ddd; overflow: auto; font-size: 12px;">${escapeHTML(shadowHTML)}</pre>

                  <h4>Node Analysis:</h4>
                  <ul>
                      <li><strong>Elements:</strong> ${nodeAnalysis.elements.length}</li>
                      <li><strong>Comment Nodes:</strong> ${nodeAnalysis.comments.length}</li>
                      <li><strong>Text Nodes:</strong> ${nodeAnalysis.textNodes.length}</li>
                      <li><strong>Empty Text Nodes:</strong> ${nodeAnalysis.emptyTextNodes.length}</li>
                      <li><strong>Anchor Boundaries:</strong> ${nodeAnalysis.anchorBoundaries.length}</li>
                  </ul>

                  <h4>Rendering Stability Check:</h4>
                  <ul>
                      <li><strong>Visible Comments in HTML:</strong> ${visibleTextInHTML === 'NO' ? '✅ None' : '❌ Found'}</li>
                      <li><strong>Visible Comment Data:</strong> ${visibleComments.length === 0 ? '✅ None' : '❌ ' + visibleComments.length}</li>
                      <li><strong>Anchor System:</strong> ${nodeAnalysis.anchorBoundaries.length > 0 ? '✅ Active (' + nodeAnalysis.anchorBoundaries.length + ' boundaries)' : '❌ Not detected'}</li>
                  </ul>

                  ${nodeAnalysis.anchorBoundaries.length > 0 ? `
                  <h4>Anchor Boundaries:</h4>
                  <ul>
                      ${nodeAnalysis.anchorBoundaries.map(boundary => `<li>Key: "${boundary.key}" | Content: "${escapeHTML(boundary.node.textContent || '')}"</li>`).join('')}
                  </ul>` : ''}

                  ${visibleComments.length > 0 ? `
                  <h4>❌ Visible Comment Contents:</h4>
                  <ul>
                      ${visibleComments.map(comment => `<li>"${escapeHTML(comment.data)}"</li>`).join('')}
                  </ul>` : ''}
              `;
          }
      };

      function escapeHTML(str) {
          const div = document.createElement('div');
          div.textContent = str;
          return div.innerHTML;
      }

      // Auto-inspect on load
      setTimeout(() => {
          inspectDOM();
      }, 100);
    </script>
  </body>
</html>
