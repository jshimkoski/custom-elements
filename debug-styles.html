<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Styles</title>
</head>
<body>
    <h1>Debug Style Rendering</h1>

    <div>
        <h2>Test 1: Basic String Style</h2>
        <test-basic></test-basic>
    </div>

    <div>
        <h2>Test 2: Function Style</h2>
        <test-function></test-function>
    </div>

    <div>
        <h2>Test 3: Dynamic Style with Dependencies</h2>
        <test-dynamic></test-dynamic>
        <button onclick="changeTheme()">Change Theme</button>
    </div>

    <script type="module">
        import { component, html } from './src/lib/runtime.js';

        // Test 1: Basic string style
        const TestBasic = component('test-basic', {
            state: { message: 'Hello World' },

            style: `
                :host {
                    display: block;
                    padding: 20px;
                    background: lightblue;
                    border: 2px solid blue;
                    margin: 10px 0;
                }
                .content {
                    color: darkblue;
                    font-weight: bold;
                }
            `,

            render: (state) => html`
                <div class="content">${state.message}</div>
            `
        });

        // Test 2: Function style (old way)
        const TestFunction = component('test-function', {
            state: {
                color: 'red',
                message: 'Function Style'
            },

            style: (state) => `
                :host {
                    display: block;
                    padding: 20px;
                    background: light${state.color};
                    border: 2px solid ${state.color};
                    margin: 10px 0;
                }
                .content {
                    color: ${state.color};
                    font-weight: bold;
                }
            `,

            render: (state) => html`
                <div class="content">${state.message} - Color: ${state.color}</div>
                <button onclick=${() => {
                    const colors = ['red', 'green', 'blue', 'purple'];
                    state.color = colors[Math.floor(Math.random() * colors.length)];
                }}>Change Color</button>
            `
        });

        // Test 3: New dynamic style with dependencies
        const TestDynamic = component('test-dynamic', {
            state: {
                theme: 'light',
                size: 'medium',
                message: 'Dynamic Style with Caching'
            },

            style: {
                css: (state) => {
                    console.log('Generating CSS for:', state.theme, state.size);
                    const themes = {
                        light: { bg: '#f0f9ff', color: '#1e40af', border: '#3b82f6' },
                        dark: { bg: '#1e293b', color: '#f1f5f9', border: '#64748b' }
                    };
                    const theme = themes[state.theme] || themes.light;
                    const padding = state.size === 'large' ? '30px' : '20px';

                    return `
                        :host {
                            display: block;
                            padding: ${padding};
                            background: ${theme.bg};
                            border: 2px solid ${theme.border};
                            margin: 10px 0;
                            border-radius: 8px;
                        }
                        .content {
                            color: ${theme.color};
                            font-weight: bold;
                        }
                        .info {
                            font-size: 12px;
                            opacity: 0.7;
                            margin-top: 10px;
                        }
                    `;
                },
                dependencies: ['theme', 'size'],
                cache: true
            },

            styleOptimizations: {
                enableCaching: true,
                enableMinification: false, // Keep readable for debugging
                enableDeduplication: true,
                debounceMs: 16
            },

            render: (state) => html`
                <div class="content">${state.message}</div>
                <div class="info">Theme: ${state.theme}, Size: ${state.size}</div>
                <button onclick=${() => {
                    state.theme = state.theme === 'light' ? 'dark' : 'light';
                }}>Toggle Theme</button>
                <button onclick=${() => {
                    state.size = state.size === 'medium' ? 'large' : 'medium';
                }}>Toggle Size</button>
                <button onclick=${() => {
                    state.message = 'Updated: ' + Date.now();
                }}>Update Message (No Style Change)</button>
            `
        });

        // Global function for external button
        window.changeTheme = () => {
            const element = document.querySelector('test-dynamic');
            if (element && element._state) {
                element._state.theme = element._state.theme === 'light' ? 'dark' : 'light';
            }
        };

        // Debug: Log shadow DOM contents after initialization
        setTimeout(() => {
            console.log('=== DEBUG: Shadow DOM Contents ===');

            document.querySelectorAll('test-basic, test-function, test-dynamic').forEach((el, index) => {
                console.log(`Element ${index + 1}:`, el.tagName);
                console.log('Shadow Root:', el.shadowRoot);
                if (el.shadowRoot) {
                    console.log('Shadow Root HTML:', el.shadowRoot.innerHTML);
                    const style = el.shadowRoot.querySelector('style');
                    console.log('Style element:', style);
                    if (style) {
                        console.log('Style content:', style.textContent);
                    }
                }
                console.log('---');
            });
        }, 100);
    </script>
</body>
</html>
