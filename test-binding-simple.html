<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Binding Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .test-section {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    input {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      background: #f8f9fa;
    }
  </style>
</head>
<body>
  <h1>Simple Binding Test</h1>

  <div class="status" id="status">
    Testing binding functionality...
  </div>

  <binding-test></binding-test>

  <script type="module">
    import { component, html } from './src/lib/runtime.js';

    component('binding-test', {
      state: {
        isDisabled: true,
        message: 'Hello World',
        count: 0
      },

      methods: {
        toggle() {
          this.isDisabled = !this.isDisabled;
          this.updateStatus();
        },

        increment() {
          this.count++;
          this.updateStatus();
        },

        updateStatus() {
          const statusEl = document.getElementById('status');
          if (statusEl) {
            statusEl.innerHTML = `
              <strong>Status:</strong><br>
              • Disabled: ${this.isDisabled}<br>
              • Count: ${this.count}<br>
              • Message: ${this.message}
            `;
          }
        }
      },

      onConnected() {
        this.updateStatus();
      },

      render(state) {
        return html`
          <div>
            <div class="test-section">
              <h3>1. Colon Binding Test (:disabled)</h3>
              <button :disabled="${state.isDisabled}" @click="${this.increment}">
                Count: ${state.count} (${state.isDisabled ? 'Disabled' : 'Enabled'})
              </button>
              <button @click="${this.toggle}">
                Toggle Disabled State
              </button>
            </div>

            <div class="test-section">
              <h3>2. v-bind Object Syntax Test</h3>
              <button v-bind="${{
                disabled: state.isDisabled,
                title: `This button is ${state.isDisabled ? 'disabled' : 'enabled'}`,
                'data-count': state.count
              }}" @click="${this.increment}">
                v-bind Button (Count: ${state.count})
              </button>
            </div>

            <div class="test-section">
              <h3>3. Input Binding Test</h3>
              <input
                type="text"
                :disabled="${state.isDisabled}"
                :value="${state.message}"
                :placeholder="${state.isDisabled ? 'Disabled input' : 'Type here'}"
              />
              <p>Input is ${state.isDisabled ? 'disabled' : 'enabled'}</p>
            </div>

            <div class="test-section">
              <h3>4. Multiple Bindings Test</h3>
              <button
                v-bind="${{
                  disabled: state.count > 5,
                  title: state.count > 5 ? 'Count limit reached' : 'Click to increment'
                }}"
                :class="${state.count > 5 ? 'limit-reached' : ''}"
                @click="${this.increment}"
              >
                ${state.count > 5 ? 'Limit Reached!' : `Click Me (${state.count}/5)`}
              </button>
              <p>Button will disable after 5 clicks</p>
            </div>

            <div class="test-section">
              <h3>Expected Results:</h3>
              <ul>
                <li>✅ Colon binding (:disabled) should work</li>
                <li>✅ v-bind object syntax should work</li>
                <li>✅ Boolean attributes should be handled correctly</li>
                <li>✅ Multiple bindings should work together</li>
                <li>✅ No console errors should appear</li>
              </ul>
            </div>
          </div>
        `;
      }
    });

    // Test verification
    window.addEventListener('load', () => {
      setTimeout(() => {
        const buttons = document.querySelectorAll('button[disabled]');
        const statusEl = document.getElementById('status');

        if (buttons.length > 0) {
          statusEl.style.background = '#d4edda';
          statusEl.innerHTML += '<br><strong>✅ Binding appears to be working!</strong>';
        } else {
          statusEl.style.background = '#f8d7da';
          statusEl.innerHTML += '<br><strong>❌ Binding may not be working correctly</strong>';
        }
      }, 100);
    });
  </script>
</body>
</html>
