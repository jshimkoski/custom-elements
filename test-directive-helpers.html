<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directive Helpers Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .test-case {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
        }
        .hidden { display: none !important; }
        .visible { display: block; }
        .red { color: red; }
        .blue { color: blue; }
        .bold { font-weight: bold; }
        .large { font-size: 1.5em; }
        button {
            margin: 5px;
            padding: 8px 16px;
            border: 1px solid #007bff;
            background: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        button:disabled {
            background: #ccc;
            border-color: #ccc;
            cursor: not-allowed;
        }
        .debug {
            background: #ffffcc;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Directive Helpers Debug Test</h1>

    <div class="debug">
        <strong>Debug Info:</strong>
        <div id="debug-output">Loading...</div>
    </div>

    <div class="test-section">
        <h2>Template Directive Syntax (v-* attributes)</h2>
        <div id="template-test"></div>
    </div>

    <div class="test-section">
        <h2>Helper Function Syntax (${helper()} interpolation)</h2>
        <div id="helper-test"></div>
    </div>

    <div class="test-section">
        <h2>Control Panel</h2>
        <button onclick="toggleVisibility()">Toggle Visibility</button>
        <button onclick="toggleClass()">Toggle Classes</button>
        <button onclick="toggleDisabled()">Toggle Disabled</button>
        <button onclick="changeStyles()">Change Styles</button>
    </div>

    <script type="module">
        import { component } from './src/lib/runtime.js';
        import { html } from './src/lib/template-compiler.js';
        import { vBind, vShow, vClass, vStyle } from './src/lib/directives.js';

        // Debug: Test what the helper functions return
        console.log('=== Directive Helper Function Outputs ===');
        console.log('vShow(true):', vShow(true));
        console.log('vShow(false):', vShow(false));
        console.log('vClass("red bold"):', vClass("red bold"));
        console.log('vClass(["red", "bold"]):', vClass(["red", "bold"]));
        console.log('vClass({red: true, bold: false}):', vClass({red: true, bold: false}));
        console.log('vStyle({color: "blue", fontSize: "20px"}):', vStyle({color: "blue", fontSize: "20px"}));
        console.log('vBind({disabled: true, placeholder: "test"}):', vBind({disabled: true, placeholder: "test"}));

        let globalState = {
            isVisible: true,
            hasError: false,
            isActive: true,
            isDisabled: false,
            dynamicColor: 'red',
            fontSize: 16
        };

        // Template Directive Test Component
        const TemplateTest = component({
            name: 'template-directive-test',

            state: globalState,

            render() {
                return html`
                    <div>
                        <h3>Template Directives (v-* syntax)</h3>

                        <div class="test-case">
                            <h4>v-show Test</h4>
                            <div v-show="${this.state.isVisible}" style="background: lightgreen; padding: 10px;">
                                This should be visible when isVisible=true
                            </div>
                            <div v-show="${!this.state.isVisible}" style="background: lightcoral; padding: 10px;">
                                This should be visible when isVisible=false
                            </div>
                        </div>

                        <div class="test-case">
                            <h4>v-class Test</h4>
                            <div v-class="${this.state.dynamicColor}">
                                Dynamic color class: ${this.state.dynamicColor}
                            </div>
                            <div v-class="${{red: this.state.hasError, blue: !this.state.hasError}}">
                                Conditional classes (red if error, blue if no error)
                            </div>
                        </div>

                        <div class="test-case">
                            <h4>v-style Test</h4>
                            <div v-style="${{color: this.state.dynamicColor, fontSize: this.state.fontSize + 'px'}}">
                                Dynamic styles: color=${this.state.dynamicColor}, fontSize=${this.state.fontSize}px
                            </div>
                        </div>

                        <div class="test-case">
                            <h4>v-bind Test</h4>
                            <input v-bind="${{disabled: this.state.isDisabled, placeholder: 'Template directive input'}}" type="text" />
                            <button v-bind="${{disabled: this.state.isDisabled}}">
                                Template Button
                            </button>
                        </div>
                    </div>
                `;
            }
        });

        // Helper Function Test Component
        const HelperTest = component({
            name: 'helper-directive-test',

            state: globalState,

            render() {
                return html`
                    <div>
                        <h3>Helper Functions (\${helper()} syntax)</h3>

                        <div class="test-case">
                            <h4>vShow Helper Test</h4>
                            <div ${vShow(this.state.isVisible)} style="background: lightgreen; padding: 10px;">
                                This should be visible when isVisible=true (vShow helper)
                            </div>
                            <div ${vShow(!this.state.isVisible)} style="background: lightcoral; padding: 10px;">
                                This should be visible when isVisible=false (vShow helper)
                            </div>
                        </div>

                        <div class="test-case">
                            <h4>vClass Helper Test</h4>
                            <div ${vClass(this.state.dynamicColor)}>
                                Dynamic color class: ${this.state.dynamicColor} (vClass helper)
                            </div>
                            <div ${vClass({red: this.state.hasError, blue: !this.state.hasError})}>
                                Conditional classes (vClass helper)
                            </div>
                            <div ${vClass(['bold', {large: this.state.isActive}])}>
                                Mixed array/object classes (vClass helper)
                            </div>
                        </div>

                        <div class="test-case">
                            <h4>vStyle Helper Test</h4>
                            <div ${vStyle({color: this.state.dynamicColor, fontSize: this.state.fontSize})}>
                                Dynamic styles (vStyle helper): color=${this.state.dynamicColor}, fontSize=${this.state.fontSize}px
                            </div>
                            <div ${vStyle('border: 2px solid purple; padding: 5px;')}>
                                String style (vStyle helper)
                            </div>
                        </div>

                        <div class="test-case">
                            <h4>vBind Helper Test</h4>
                            <input ${vBind({disabled: this.state.isDisabled, placeholder: 'Helper function input'})} type="text" />
                            <button ${vBind({disabled: this.state.isDisabled})}>
                                Helper Button
                            </button>
                        </div>
                    </div>
                `;
            }
        });

        // Register components
        customElements.define('template-directive-test', TemplateTest);
        customElements.define('helper-directive-test', HelperTest);

        // Mount components
        document.getElementById('template-test').innerHTML = '<template-directive-test></template-directive-test>';
        document.getElementById('helper-test').innerHTML = '<helper-directive-test></helper-directive-test>';

        // Global control functions
        window.toggleVisibility = function() {
            globalState.isVisible = !globalState.isVisible;
            updateDebugInfo();
        };

        window.toggleClass = function() {
            globalState.hasError = !globalState.hasError;
            globalState.dynamicColor = globalState.dynamicColor === 'red' ? 'blue' : 'red';
            updateDebugInfo();
        };

        window.toggleDisabled = function() {
            globalState.isDisabled = !globalState.isDisabled;
            updateDebugInfo();
        };

        window.changeStyles = function() {
            globalState.fontSize = globalState.fontSize === 16 ? 24 : 16;
            globalState.isActive = !globalState.isActive;
            updateDebugInfo();
        };

        function updateDebugInfo() {
            const debugOutput = document.getElementById('debug-output');
            debugOutput.innerHTML = `
                <div>isVisible: ${globalState.isVisible}</div>
                <div>hasError: ${globalState.hasError}</div>
                <div>isActive: ${globalState.isActive}</div>
                <div>isDisabled: ${globalState.isDisabled}</div>
                <div>dynamicColor: ${globalState.dynamicColor}</div>
                <div>fontSize: ${globalState.fontSize}</div>
                <hr>
                <div>Template Component State: ${JSON.stringify(document.querySelector('template-directive-test')?._state || {})}</div>
                <div>Helper Component State: ${JSON.stringify(document.querySelector('helper-directive-test')?._state || {})}</div>
            `;
        }

        // Initial debug info
        setTimeout(updateDebugInfo, 100);

        // Test inspection
        setTimeout(() => {
            console.log('=== Component Inspection ===');
            const templateComp = document.querySelector('template-directive-test');
            const helperComp = document.querySelector('helper-directive-test');

            if (templateComp) {
                console.log('Template component:', templateComp);
                console.log('Template component state:', templateComp._state);
                console.log('Template component shadow DOM:', templateComp.shadowRoot?.innerHTML);
            }

            if (helperComp) {
                console.log('Helper component:', helperComp);
                console.log('Helper component state:', helperComp._state);
                console.log('Helper component shadow DOM:', helperComp.shadowRoot?.innerHTML);
            }
        }, 500);
    </script>
</body>
</html>
