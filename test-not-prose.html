<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testing not-prose</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 2rem;
        background: #f5f5f5;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Testing .not-prose Functionality</h1>
      <p>
        This page tests if the <code>.not-prose</code> class correctly excludes
        elements from prose styling.
      </p>

      <my-prose-component></my-prose-component>
    </div>

    <script type="module">
      import { define, css, html } from './src/lib/index';

      define('my-prose-component', {
        template: () => html`
          <article class="prose">
            <h2>Article with Prose Styling</h2>
            <p>
              This paragraph should have prose styling with margins and colors.
            </p>
            <p>This is another paragraph with prose styling.</p>

            <div class="not-prose">
              <h3>This heading should NOT have prose styling</h3>
              <p>
                This paragraph is inside .not-prose so it should NOT have
                margins or colors.
              </p>
              <p>Another paragraph that should also be unstyled.</p>

              <ul>
                <li>Unstyled list item 1</li>
                <li>Unstyled list item 2</li>
                <li>Unstyled list item 3</li>
              </ul>
            </div>

            <p>
              Back to prose styling - this paragraph should have proper margins
              and colors again.
            </p>

            <ul>
              <li>Styled list item 1</li>
              <li>Styled list item 2</li>
              <li>
                Styled list item 3 with nested list:
                <ul>
                  <li>Nested styled item 1</li>
                  <li>Nested styled item 2</li>
                </ul>
              </li>
            </ul>

            <code>This inline code should be styled</code>

            <pre><code>function example() {
  return "This code block should be styled";
}</code></pre>
          </article>
        `,
        styles: () => css`
          :host {
            display: block;
          }
          .not-prose {
            background: #fff3cd;
            padding: 1rem;
            border: 2px solid #ffc107;
            border-radius: 4px;
          }
        `,
      });
    </script>
  </body>
</html>
